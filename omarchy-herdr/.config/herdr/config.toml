onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane
#
# Differences from tmux.conf's Vim bindings (left unmapped, for follow-up):
# - No repeatable prefix keys (tmux bind -r); each press needs the prefix again.
#   resize_mode is the closest analogue.
# - resize_mode sits on prefix+ctrl+arrows, where tmux resizes by 1 cell.
#   herdr's default prefix+r is taken by rename_tab here.
# - Previous pane (tmux prefix O): cycle_pane_previous exists, but
#   prefix+shift+o is taken by rename_pane.
# - Last window / last session (tmux prefix Tab / BTab): no herdr action.
#   herdr defaults use prefix+tab / prefix+shift+tab for pane cycling.
# - last_pane (prefix+;) spans workspaces and tabs, unlike tmux's last-pane.
# - First / last window (tmux prefix g / G): no herdr action; herdr's default
#   prefix+g opens the session navigator.
# - Join pane from last window (tmux prefix @): no herdr equivalent.
# - Copy mode keys aren't configurable: no prompt jumps ([ / ]), zz/zt/zb, or
#   prefix C-u half-page entry. See edit_scrollback (default prefix+e).
# - Navigate mode already uses hjkl for pane focus by default.

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+shift+j", "alt+enter"]
split_vertical = ["prefix+shift+l", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = ["prefix+h", "ctrl+alt+left"]
focus_pane_down = ["prefix+j", "ctrl+alt+down"]
focus_pane_up = ["prefix+k", "ctrl+alt+up"]
focus_pane_right = ["prefix+l", "ctrl+alt+right"]

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows and prefix C-hjkl (no repeat in herdr)
# prefix+ctrl+h needs CSI-u (extended keys); terminals without it send BSpace instead
resize_pane_left = ["prefix+ctrl+h", "ctrl+alt+shift+left"]
resize_pane_down = ["prefix+ctrl+j", "ctrl+alt+shift+down"]
resize_pane_up = ["prefix+ctrl+k", "ctrl+alt+shift+up"]
resize_pane_right = ["prefix+ctrl+l", "ctrl+alt+shift+right"]

# Like swap-pane -t {left-of} etc. on prefix C-S-hjkl
swap_pane_left = "prefix+ctrl+shift+h"
swap_pane_down = "prefix+ctrl+shift+j"
swap_pane_up = "prefix+ctrl+shift+k"
swap_pane_right = "prefix+ctrl+shift+l"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+shift+x"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "prefix+alt+h", "alt+left"]
next_tab = ["prefix+n", "prefix+alt+l", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = ["prefix+alt+shift+h", "alt+shift+left"]
move_tab_next = ["prefix+alt+shift+l", "alt+shift+right"]

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "prefix+alt+k", "alt+up"]
next_workspace = ["prefix+shift+n", "prefix+alt+j", "alt+down"]

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
agent_panel_sort = "spaces"
